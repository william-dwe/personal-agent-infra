<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="diagram-title diagram-desc" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <title id="diagram-title">personal-agent-infra network architecture</title>
  <desc id="diagram-desc">William device reaches dashboard and 9router over Tailscale. UFW allows tailscale0 and SSH port 22. 9router is bound to the Tailscale IP. Headroom remains internal to Docker app-network.</desc>
  <defs>
    <marker id="arrow-slate" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0,0 L10,3.5 L0,7 Z" fill="#64748b"/></marker>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0,0 L10,3.5 L0,7 Z" fill="#22d3ee"/></marker>
    <marker id="arrow-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0,0 L10,3.5 L0,7 Z" fill="#34d399"/></marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width=".5"/></pattern>
  </defs>
  <!-- Solid dark background: text colors assume dark bg; GitHub light theme is white. -->
  <rect width="1200" height="760" fill="#020617"/>
  <rect width="1200" height="760" fill="url(#grid)"/>

  <!-- Arrows first: all components render above flows. -->
  <path d="M185 324 H225 V145 H268" fill="none" stroke="#22d3ee" stroke-width="1.8" marker-end="url(#arrow-cyan)"/>
  <text x="190" y="225" fill="#22d3ee" font-size="10" text-anchor="middle">Tailscale</text>
  <path d="M390 185 V238" fill="none" stroke="#22d3ee" stroke-width="1.8" marker-end="url(#arrow-cyan)"/>
  <path d="M725 185 V274" fill="none" stroke="#22d3ee" stroke-width="1.8" marker-end="url(#arrow-cyan)"/>
  <path d="M705 350 V404" fill="none" stroke="#34d399" stroke-width="1.8" marker-end="url(#arrow-emerald)"/>
  <text x="745" y="380" fill="#34d399" font-size="9">/v1/compress</text>
  <path d="M835 313 H978" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow-slate)"/>
  <text x="906" y="299" fill="#94a3b8" font-size="9" text-anchor="middle">provider requests</text>

  <!-- Boundaries -->
  <rect x="230" y="45" width="690" height="575" rx="14" fill="rgba(251,191,36,.05)" stroke="#fbbf24" stroke-width="1.2" stroke-dasharray="8 4"/>
  <text x="248" y="70" fill="#fbbf24" font-size="11" font-weight="700">VPS boundary</text>
  <rect x="550" y="215" width="325" height="300" rx="12" fill="rgba(167,139,250,.05)" stroke="#a78bfa" stroke-width="1.1" stroke-dasharray="6 4"/>
  <text x="568" y="238" fill="#a78bfa" font-size="10" font-weight="700">Docker app-network</text>

  <!-- Opaque underlays sit beneath semi-transparent boxes. -->
  <rect x="35" y="285" width="150" height="78" rx="7" fill="#0f172a"/>
  <rect x="35" y="285" width="150" height="78" rx="7" fill="rgba(8,51,68,.42)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="110" y="315" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle">William device</text>
  <text x="110" y="337" fill="#94a3b8" font-size="10" text-anchor="middle">Tailscale client</text>

  <rect x="268" y="105" width="620" height="80" rx="8" fill="#0f172a"/>
  <rect x="268" y="105" width="620" height="80" rx="8" fill="rgba(136,19,55,.32)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="292" y="136" fill="#f8fafc" font-size="12" font-weight="700">UFW</text>
  <text x="292" y="158" fill="#94a3b8" font-size="10">allow incoming: tailscale0, TCP 22</text>
  <text x="292" y="174" fill="#94a3b8" font-size="10">default: deny incoming; allow outgoing</text>

  <rect x="275" y="238" width="230" height="90" rx="7" fill="#0f172a"/>
  <rect x="275" y="238" width="230" height="90" rx="7" fill="rgba(8,51,68,.42)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="390" y="270" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle">Hermes dashboard</text>
  <text x="390" y="290" fill="#94a3b8" font-size="10" text-anchor="middle">hermes-dashboard@&lt;user&gt;</text>
  <text x="390" y="310" fill="#22d3ee" font-size="10" text-anchor="middle">:9119 · --insecure</text>

  <rect x="575" y="274" width="260" height="78" rx="7" fill="#0f172a"/>
  <rect x="575" y="274" width="260" height="78" rx="7" fill="rgba(6,78,59,.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="705" y="303" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle">9router</text>
  <text x="705" y="322" fill="#94a3b8" font-size="10" text-anchor="middle">TAILSCALE_IP:20128 · data/9router</text>
  <text x="705" y="339" fill="#34d399" font-size="9" text-anchor="middle">HEADROOM_URL=http://headroom:8787</text>

  <rect x="575" y="404" width="260" height="78" rx="7" fill="#0f172a"/>
  <rect x="575" y="404" width="260" height="78" rx="7" fill="rgba(76,29,149,.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="705" y="433" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle">Headroom</text>
  <text x="705" y="452" fill="#94a3b8" font-size="10" text-anchor="middle">:8787 · no host port</text>
  <text x="705" y="469" fill="#a78bfa" font-size="9" text-anchor="middle">headroom_workspace volume</text>

  <rect x="980" y="275" width="180" height="78" rx="7" fill="#0f172a"/>
  <rect x="980" y="275" width="180" height="78" rx="7" fill="rgba(120,53,15,.32)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="1070" y="305" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle">External LLM</text>
  <text x="1070" y="326" fill="#94a3b8" font-size="10" text-anchor="middle">providers</text>

  <!-- Legend remains below every boundary. -->
  <text x="275" y="665" fill="#f8fafc" font-size="11" font-weight="700">Legend</text>
  <rect x="275" y="680" width="17" height="11" rx="2" fill="rgba(8,51,68,.42)" stroke="#22d3ee"/>
  <text x="300" y="689" fill="#94a3b8" font-size="9">tailnet service</text>
  <rect x="435" y="680" width="17" height="11" rx="2" fill="rgba(6,78,59,.4)" stroke="#34d399"/>
  <text x="460" y="689" fill="#94a3b8" font-size="9">container</text>
  <rect x="565" y="680" width="17" height="11" rx="2" fill="rgba(76,29,149,.4)" stroke="#a78bfa"/>
  <text x="590" y="689" fill="#94a3b8" font-size="9">internal service</text>
  <rect x="755" y="680" width="17" height="11" rx="2" fill="rgba(136,19,55,.32)" stroke="#fb7185"/>
  <text x="780" y="689" fill="#94a3b8" font-size="9">security (UFW)</text>
  <rect x="435" y="705" width="17" height="11" rx="2" fill="rgba(120,53,15,.32)" stroke="#fbbf24"/>
  <text x="460" y="714" fill="#94a3b8" font-size="9">cloud/provider</text>
</svg>

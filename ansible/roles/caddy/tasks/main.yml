- name: Install Caddy
  ansible.builtin.apt:
    name: caddy
    state: present

- name: Read cached Tailscale IP
  ansible.builtin.stat:
    path: "{{ caddy_ip_cache }}"
  register: caddy_ip_stat

# Phase 1: first boot only. Bind loopback so Caddy runs before Tailscale IP is known.
- name: Bootstrap Caddy on loopback
  when: not caddy_ip_stat.stat.exists
  block:
    - name: Template bootstrap Caddyfile
      ansible.builtin.template:
        src: Caddyfile.j2
        dest: "{{ caddy_config }}"
        owner: root
        group: caddy
        mode: "0640"
        validate: caddy validate --adapter caddyfile --config %s
      vars:
        caddy_bind_ip: 127.0.0.1

    - name: Ensure Caddy running
      ansible.builtin.systemd:
        name: caddy
        state: started
        enabled: true

    - name: Wait for Tailscale IPv4
      ansible.builtin.command: tailscale ip -4
      register: caddy_tail_ip
      until: caddy_tail_ip.rc == 0 and caddy_tail_ip.stdout | trim | length > 0
      retries: "{{ caddy_tail_ip_retries }}"
      delay: "{{ caddy_tail_ip_delay }}"
      changed_when: false
      check_mode: false

    - name: Cache Tailscale IP
      ansible.builtin.copy:
        content: "{{ caddy_tail_ip.stdout | trim }}\n"
        dest: "{{ caddy_ip_cache }}"
        owner: root
        group: root
        mode: "0644"

# Phase 2: always converge on cached IP. Idempotent; reload only on change.
- name: Read Tailscale IP from cache
  ansible.builtin.slurp:
    src: "{{ caddy_ip_cache }}"
  register: caddy_ip_file
  when: caddy_ip_stat.stat.exists or not ansible_check_mode

- name: Template final Caddyfile bound to Tailscale IP
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: "{{ caddy_config }}"
    owner: root
    group: caddy
    mode: "0640"
    validate: caddy validate --adapter caddyfile --config %s
  vars:
    caddy_bind_ip: "{{ (caddy_ip_file.content | default('MTI3LjAuMC4xCg==') | b64decode) | trim }}"
  notify: Reload Caddy

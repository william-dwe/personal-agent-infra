- name: Create node-exporter directory
  ansible.builtin.file:
    path: "{{ node_exporter_dir }}"
    state: directory
    mode: "0755"
- name: Render node-exporter Compose file
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ node_exporter_dir }}/compose.yml"
    mode: "0644"
  register: node_exporter_compose

- name: Validate node-exporter Compose file
  ansible.builtin.command: docker compose -f {{ node_exporter_dir }}/compose.yml config --quiet
  changed_when: false
  check_mode: false
  when: node_exporter_compose is not failed and not ansible_check_mode

- name: Start node-exporter
  ansible.builtin.command: docker compose -f {{ node_exporter_dir }}/compose.yml up -d --wait --wait-timeout 120
  changed_when: false # ponytail: Compose up is idempotent; changed status not parsed.

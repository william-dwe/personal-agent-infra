- name: Read Tailscale Serve rules
  ansible.builtin.command: tailscale serve status
  register: serve
  changed_when: false
  failed_when: false
  check_mode: false

- name: Remove obsolete Headroom Tailscale rule
  ansible.builtin.command: tailscale serve --tcp=8787 off
  when: serve.stdout is search(':8787(\\s|$)')

- name: Validate core Compose configuration
  ansible.builtin.command: docker compose --project-directory {{ infra_dir }} --env-file {{ runtime_env }} config --quiet
  changed_when: false

- name: Start Headroom
  ansible.builtin.command: docker compose --project-directory {{ infra_dir }} --env-file {{ runtime_env }} up -d --wait --wait-timeout 120 {{ headroom_compose_service }}
  changed_when: false
  # ponytail: Compose up is itself idempotent; changed status is not parsed.

- name: Smoke test Headroom
  ansible.builtin.command: "bash {{ infra_dir }}/scripts/check-headroom.sh"
  changed_when: false
  check_mode: false

- name: Create grafana directory
  ansible.builtin.file:
    path: "{{ grafana_dir }}"
    state: directory
    mode: "0755"

- name: Create Grafana datasource directory
  ansible.builtin.file:
    path: "{{ grafana_dir }}/provisioning/datasources"
    state: directory
    mode: "0755"

- name: Render Grafana Prometheus datasource
  ansible.builtin.template:
    src: datasource.yml.j2
    dest: "{{ grafana_dir }}/provisioning/datasources/prometheus.yml"
    mode: "0644"
  when: grafana_prometheus_url | length > 0
- name: Render grafana Compose file
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ grafana_dir }}/compose.yml"
    mode: "0644"
  register: grafana_compose

- name: Validate grafana Compose file
  ansible.builtin.command: docker compose -f {{ grafana_dir }}/compose.yml config --quiet
  changed_when: false
  check_mode: false
  when: grafana_compose is not failed and not ansible_check_mode

- name: Start grafana
  ansible.builtin.command: docker compose -f {{ grafana_dir }}/compose.yml up -d --wait --wait-timeout 120
  changed_when: false # ponytail: Compose up is idempotent; changed status not parsed.

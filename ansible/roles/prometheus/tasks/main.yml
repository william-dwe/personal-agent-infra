- name: Create prometheus directory
  ansible.builtin.file:
    path: "{{ prometheus_dir }}"
    state: directory
    mode: "0755"

- name: Render Prometheus config
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "{{ prometheus_dir }}/prometheus.yml"
    mode: "0644"
- name: Render prometheus Compose file
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ prometheus_dir }}/compose.yml"
    mode: "0644"
  register: prometheus_compose

- name: Validate prometheus Compose file
  ansible.builtin.command: docker compose -f {{ prometheus_dir }}/compose.yml config --quiet
  changed_when: false
  check_mode: false
  when: prometheus_compose is not failed and not ansible_check_mode

- name: Start prometheus
  ansible.builtin.command: docker compose -f {{ prometheus_dir }}/compose.yml up -d --wait --wait-timeout 120
  changed_when: false # ponytail: Compose up is idempotent; changed status not parsed.

- name: Create cadvisor directory
  ansible.builtin.file:
    path: "{{ cadvisor_dir }}"
    state: directory
    mode: "0755"
- name: Render cadvisor Compose file
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ cadvisor_dir }}/compose.yml"
    mode: "0644"
  register: cadvisor_compose

- name: Validate cadvisor Compose file
  ansible.builtin.command: docker compose -f {{ cadvisor_dir }}/compose.yml config --quiet
  changed_when: false
  check_mode: false
  when: cadvisor_compose is not failed and not ansible_check_mode

- name: Start cadvisor
  ansible.builtin.command: docker compose -f {{ cadvisor_dir }}/compose.yml up -d --wait --wait-timeout 120
  changed_when: false # ponytail: Compose up is idempotent; changed status not parsed.

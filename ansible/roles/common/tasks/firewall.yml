- name: Deny incoming traffic by default
  community.general.ufw:
    default: deny
    direction: incoming

- name: Allow outgoing traffic by default
  community.general.ufw:
    default: allow
    direction: outgoing

- name: Allow Tailscale traffic
  community.general.ufw:
    rule: allow
    interface: tailscale0
    direction: in

- name: Allow SSH
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp

- name: Enable firewall
  community.general.ufw:
    state: enabled

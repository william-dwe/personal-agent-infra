- name: Render runtime environment
  ansible.builtin.command: "{{ infra_dir }}/scripts/dotenv-env.sh render"
  changed_when: false
  # ponytail: re-renders every run; content is identical unless .env or Tailscale identity changed.

- name: Validate core Compose configuration
  ansible.builtin.command: docker compose --project-directory {{ infra_dir }} --env-file {{ runtime_env }} config --quiet
  changed_when: false

- name: Start 9router
  ansible.builtin.command: docker compose --project-directory {{ infra_dir }} --env-file {{ runtime_env }} up -d --wait --wait-timeout 120 {{ router_compose_service }}
  changed_when: false
  # ponytail: Compose up is itself idempotent; changed status is not parsed.

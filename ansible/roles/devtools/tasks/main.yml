- name: Install developer tool dependencies
  ansible.builtin.apt:
    name:
      - python-is-python3
      - python3-pip
      - xz-utils
    state: present
    update_cache: true

- name: Download Node.js archive
  ansible.builtin.get_url:
    url: "https://nodejs.org/dist/v{{ node_version }}/node-v{{ node_version }}-{{ node_platform }}.tar.xz"
    dest: "/tmp/node-v{{ node_version }}-{{ node_platform }}.tar.xz"
    checksum: "sha256:{{ node_sha256 }}"
    mode: "0644"
  when: not ansible_check_mode

- name: Extract Node.js
  ansible.builtin.unarchive:
    src: "/tmp/node-v{{ node_version }}-{{ node_platform }}.tar.xz"
    dest: /opt
    remote_src: true
    creates: "/opt/node-v{{ node_version }}-{{ node_platform }}/bin/node"
  when: not ansible_check_mode

- name: Link Node.js commands
  ansible.builtin.file:
    src: "/opt/node-v{{ node_version }}-{{ node_platform }}/bin/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    state: link
  loop:
    - node
    - npm
    - npx
    - corepack
  when: not ansible_check_mode

- name: Download Go archive
  ansible.builtin.get_url:
    url: "https://go.dev/dl/go{{ go_version }}.linux-amd64.tar.gz"
    dest: "/tmp/go{{ go_version }}.linux-amd64.tar.gz"
    checksum: "sha256:{{ go_sha256 }}"
    mode: "0644"
  when: not ansible_check_mode

- name: Extract Go
  ansible.builtin.unarchive:
    src: "/tmp/go{{ go_version }}.linux-amd64.tar.gz"
    dest: /opt
    remote_src: true
    creates: "/opt/go-{{ go_version }}/bin/go"
    extra_opts:
      - "--transform=s,^go,go-{{ go_version }},"
  when: not ansible_check_mode

- name: Link Go command
  ansible.builtin.file:
    src: "/opt/go-{{ go_version }}/bin/go"
    dest: /usr/local/bin/go
    state: link
  when: not ansible_check_mode

- name: Install TypeScript
  ansible.builtin.command: npm install --global typescript
  args:
    creates: /usr/local/bin/tsc
  when: not ansible_check_mode

- name: Install Herdr
  ansible.builtin.shell: curl -fsSL https://herdr.dev/install.sh | sh
  become_user: "{{ admin_user }}"
  environment:
    HOME: "/home/{{ admin_user }}"
  args:
    creates: "/home/{{ admin_user }}/.local/bin/herdr"
  when: not ansible_check_mode

- name: Install OMP
  ansible.builtin.shell: curl -fsSL https://omp.sh/install | sh
  become_user: "{{ admin_user }}"
  environment:
    HOME: "/home/{{ admin_user }}"
  args:
    creates: "/home/{{ admin_user }}/.local/bin/omp"
  when: not ansible_check_mode

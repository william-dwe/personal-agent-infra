- name: Create Hermes user
  ansible.builtin.user:
    name: "{{ agent_user }}"
    groups: sudo
    append: true

- name: Install Oh My Zsh for Hermes
  ansible.builtin.shell: sh -c "$(curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)"
  become_user: "{{ agent_user }}"
  environment:
    RUNZSH: "no"
    CHSH: "no"
  args:
    creates: "/home/{{ agent_user }}/.oh-my-zsh"

- name: Set Hermes shell to Zsh
  ansible.builtin.user:
    name: "{{ agent_user }}"
    shell: /bin/zsh

- name: Fall back to Zsh from Bash if login shell is overridden
  ansible.builtin.blockinfile:
    path: "/home/{{ agent_user }}/.bashrc"
    marker: "# {mark} ANSIBLE MANAGED BLOCK: exec zsh fallback"
    block: |
      if [ -t 1 ] && [ -z "$ZSH_VERSION" ] && command -v zsh >/dev/null 2>&1; then
        exec zsh
      fi
    insertafter: EOF

- name: Check Hermes authorized keys
  ansible.builtin.stat:
    path: "/home/{{ agent_user }}/.ssh/authorized_keys"
  register: hermes_keys

- name: Copy admin SSH configuration to Hermes
  ansible.builtin.copy:
    src: "/home/{{ admin_user }}/.ssh/"
    dest: "/home/{{ agent_user }}/.ssh/"
    remote_src: true
    owner: "{{ agent_user }}"
    group: "{{ agent_user }}"
    mode: preserve
  when: not hermes_keys.stat.exists or hermes_keys.stat.size == 0

- name: Secure Hermes SSH directory
  ansible.builtin.file:
    path: "/home/{{ agent_user }}/.ssh"
    owner: "{{ agent_user }}"
    group: "{{ agent_user }}"
    mode: "0700"
  when: not hermes_keys.stat.exists or hermes_keys.stat.size == 0

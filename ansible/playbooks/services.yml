- name: Start personal-agent services
  hosts: all
  become: true
  roles:
    - role: headroom
      tags: [headroom]
    - role: 9router
      tags: [9router]
    - role: butler
      tags: [butler-deploy]
      when: "'butler-deploy' in ansible_run_tags"
    - role: node-exporter
      tags: [node-exporter, monitoring]
    - role: cadvisor
      tags: [cadvisor, monitoring]
    - role: prometheus
      tags: [prometheus, monitoring]
    - role: grafana
      tags: [grafana, monitoring]
    # Cutover-only: the bare-systemd units on :9119/:6767 must be stopped first.
    # These never run implicitly; invoke explicitly with --tags hermes or --tags paseo.
    - role: hermes
      hermes_compose: true
      tags: [hermes, never]
    - role: paseo
      tags: [paseo, never]

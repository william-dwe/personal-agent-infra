- name: Start personal-agent services
  hosts: all
  become: true
  roles:
    - role: headroom
      tags: [headroom]
    - role: 9router
      tags: [9router]
    - role: butler
      tags: [butler-deploy]
      when: "'butler-deploy' in ansible_run_tags"
    # Cutover-only: bare-systemd units on :9119/:6767 must be stopped first. Run explicitly with --tags.
    - role: hermes
      hermes_compose: true
      tags: [hermes, never]
    - role: paseo
      tags: [paseo, never]

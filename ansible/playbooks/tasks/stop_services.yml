- name: Find active services to stop
  ansible.builtin.command: >-
    systemctl list-units --state=active --plain --no-legend
    hermes-dashboard@* hermes-gateway@* butler-review-queue.timer butler-review-queue.service
  register: active_units
  changed_when: false
  check_mode: false

- name: Record active services
  ansible.builtin.set_fact:
    stopped_units: "{{ active_units.stdout_lines | map('split') | map('first') | list }}"

- name: Stop active services
  ansible.builtin.command: "systemctl stop {{ stopped_units | join(' ') }}"
  when: stopped_units | length > 0

- name: Find running containers
  ansible.builtin.command: docker ps -q
  register: running
  changed_when: false
  check_mode: false

- name: Record running containers
  ansible.builtin.set_fact:
    stopped_containers: "{{ running.stdout_lines }}"

- name: Stop running containers
  ansible.builtin.command: "docker stop {{ stopped_containers | join(' ') }}"
  when: stopped_containers | length > 0
